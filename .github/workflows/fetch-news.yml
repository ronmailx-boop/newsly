name: Fetch news

on:
  # לא על השעה/רבעי השעה העגולים בכוונה - שם העומס הכי גבוה על GitHub
  # Actions ולכן הכי סביר לעיכוב/דילוג. זה עדיין לא פותר את חוסר האמינות
  # של GitHub scheduled workflows (רץ "best-effort", יכול לדלג ריצה
  # שלמה בלי הודעה) - הפתרון המלא הוא trigger חיצוני, ראו PROJECT_STATE.md.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and merge RSS feeds
        run: npm run fetch-news

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No changes to data/news.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: update news feed"
          git push
