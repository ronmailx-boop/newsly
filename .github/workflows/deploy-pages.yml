name: Deploy Pages

on:
  push:
    branches: [main]
  # GITHUB_TOKEN-ל push-ים (כמו ה-commit האוטומטי של fetch-news.yml) לא
  # מפעילים workflows אחרים ב-`on: push` - זה מנגנון הגנה של GitHub מפני
  # לולאות אינסופיות. workflow_run כן מופעל במקרה כזה, אז זה מה שמבטיח
  # שריענון הנתונים כל 15 דקות אכן יגיע ל-Pages החי.
  #
  # **מושבת זמנית (2026-10-03):** deployment תקוע במצב `waiting` ב-Pages
  # של GitHub מ-2026-09-30 16:45 חוסם כל deploy חדש (הם מתבטלים אחד אחרי
  # השני כי הם מחכים מאחוריו). כל עוד deploy אחד לא עובר בהצלחה, אין טעם
  # לייצר עוד ניסיונות שרק יתבטלו וידחפו commit ל-main לשווא - זה גם
  # מבזבז דקות Action. **יש להחזיר את זה בחזרה ברגע שה-deployment התקוע
  # מנוקה** (דרך Settings > Pages - להחליף Source ללוך-חזור, או לבטל אותו
  # דרך ה-API) - ראו PROJECT_STATE.md לפרטים המלאים.
  # workflow_run:
  #   workflows: ["Fetch news"]
  #   types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
