name: Diagnose N12 RSS

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check mako RSS index page for a channel-12/N12 feed
        run: |
          echo "=== mako RSS index page ==="
          curl -sS -A "Mozilla/5.0 (compatible; NewslyBot/1.0)" \
            "https://www.mako.co.il/rss/Article-64159d874b70221004.htm" \
            -w "\nHTTP_STATUS:%{http_code}\n" -o /tmp/mako-rss-index.html
          echo "--- extracted .xml / rss links ---"
          grep -oE 'https?://[^"'"'"' ]+\.(xml|rss)[^"'"'"' ]*' /tmp/mako-rss-index.html | sort -u || echo "none found"
          echo "--- lines mentioning 'rss' (context) ---"
          grep -i "rss" /tmp/mako-rss-index.html | head -40

      - name: Try plausible mako/n12 RSS feed URL patterns directly
        run: |
          for url in \
            "https://www.mako.co.il/rss/news-israel.xml" \
            "https://www.mako.co.il/rss/news-military.xml" \
            "https://www.mako.co.il/rss/news-law.xml" \
            "https://www.mako.co.il/news-channel12?type=rss" \
            "https://www.n12.co.il/rss.xml" \
            "https://www.n12.co.il/feed" \
            "https://www.n12.co.il/rss/news.xml" \
            ; do
            echo "=== $url ==="
            status=$(curl -sS -o /tmp/body.xml -A "Mozilla/5.0 (compatible; NewslyBot/1.0)" -w "%{http_code}" --max-time 10 "$url" || echo "ERR")
            ct=$(curl -sS -o /dev/null -A "Mozilla/5.0 (compatible; NewslyBot/1.0)" -w "%{content_type}" --max-time 10 "$url" || echo "ERR")
            size=$(wc -c < /tmp/body.xml)
            echo "status=$status content_type=$ct bytes=$size"
            head -c 200 /tmp/body.xml
            echo ""
            echo ""
          done

      - name: Follow n12.co.il redirects to see final destination
        run: |
          for url in "https://www.n12.co.il/rss.xml" "https://www.n12.co.il/feed" "https://www.n12.co.il/rss/news.xml"; do
            echo "=== $url (following redirects) ==="
            curl -sS -L -A "Mozilla/5.0 (compatible; NewslyBot/1.0)" -w "\nFINAL_URL:%{url_effective}\nHTTP_STATUS:%{http_code}\n" --max-time 10 "$url" -o /tmp/redirected.xml
            echo "content_type/size:"
            wc -c < /tmp/redirected.xml
            head -c 200 /tmp/redirected.xml
            echo ""
          done

      - name: Inspect full content of news-israel.xml (titles, dates, item count)
        run: |
          curl -sS -A "Mozilla/5.0 (compatible; NewslyBot/1.0)" --max-time 15 \
            "https://www.mako.co.il/rss/news-israel.xml" -o /tmp/news-israel.xml
          echo "=== byte size ==="
          wc -c < /tmp/news-israel.xml
          echo "=== item count ==="
          grep -o "<item>" /tmp/news-israel.xml | wc -l
          echo "=== channel title/description ==="
          grep -oE "<title>[^<]*</title>|<description>[^<]*</description>" /tmp/news-israel.xml | head -6
          echo "=== first 10 item titles ==="
          grep -oE "<title>[^<]*</title>" /tmp/news-israel.xml | sed -n '2,11p'
          echo "=== first 10 pubDates ==="
          grep -oE "<pubDate>[^<]*</pubDate>" /tmp/news-israel.xml | head -10
          echo "=== first 10 links ==="
          grep -oE "<link>[^<]*</link>" /tmp/news-israel.xml | head -10

      - name: Check whether a real mako.co.il article page is anti-bot blocked
        run: |
          url="https://www.mako.co.il/news-israel/2026_q3/Article-61ff219f82f90a1027.htm"
          echo "=== $url ==="
          curl -sS -A "Mozilla/5.0 (compatible; NewslyBot/1.0)" \
            -D /tmp/article-headers.txt -o /tmp/article-body.html \
            -w "\nHTTP_STATUS:%{http_code}\n" --max-time 15 "$url"
          echo "--- response headers ---"
          cat /tmp/article-headers.txt
          echo "--- body size ---"
          wc -c < /tmp/article-body.html
          echo "--- body snippet (first 400 chars) ---"
          head -c 400 /tmp/article-body.html
          echo ""
          echo "--- does body contain the article's own title text? ---"
          grep -c "סייעת בגן\|תינוקות" /tmp/article-body.html || echo "0 (not found)"
