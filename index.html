<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsly - כל החדשות במקום אחד</title>
  <meta name="description" content="מרכז חדשות שמאגד כותרות מ-ynet, וואלה ומעריב במקום אחד" />
  <meta name="theme-color" content="#7367f0" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Newsly</h1>
    <p class="app-subtitle">כל החדשות, במקום אחד</p>
  </header>

  <nav class="source-tabs" aria-label="סינון לפי מקור חדשות">
    <button type="button" class="tab is-active" data-source="all">הכל</button>
    <button type="button" class="tab" data-source="ynet">ynet</button>
    <button type="button" class="tab" data-source="walla">וואלה</button>
    <button type="button" class="tab" data-source="maariv">מעריב</button>
    <button type="button" class="tab" data-source="globes">גלובס</button>
  </nav>

  <main id="feed" class="feed" aria-live="polite">
    <p class="status-message" id="status-message">טוען כותרות...</p>
  </main>

  <footer class="app-footer">
    <p id="updated-at"></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
