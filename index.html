<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Newsly - כל החדשות במקום אחד</title>
  <meta name="description" content="מרכז חדשות שמאגד כותרות מ-ynet, וואלה ומעריב במקום אחד, בתצוגת גלילה של כותרת אחת במסך" />
  <meta name="theme-color" content="#7367f0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__row">
      <h1 class="app-title">Newsly</h1>
      <button
        type="button"
        class="settings-toggle"
        id="settings-toggle"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="settings-panel"
        aria-label="הגדרות גלילה אוטומטית"
      >⚙️</button>
    </div>
    <nav class="source-tabs" aria-label="סינון לפי מקור חדשות">
      <button type="button" class="tab is-active" data-source="all">הכל</button>
      <button type="button" class="tab" data-source="ynet">ynet</button>
      <button type="button" class="tab" data-source="walla">וואלה</button>
      <button type="button" class="tab" data-source="maariv">מעריב</button>
      <button type="button" class="tab" data-source="israelhayom">ישראל היום</button>
      <button type="button" class="tab" data-source="kikar">כיכר השבת</button>
      <button type="button" class="tab" data-source="hakolhayehudi">הקול היהודי</button>
    </nav>

    <div class="settings-panel" id="settings-panel" hidden>
      <p class="settings-panel__title">גלילה אוטומטית - כל כמה זמן להחליף כותרת</p>
      <div class="speed-options" role="group" aria-label="מהירות גלילה אוטומטית">
        <button type="button" class="speed-btn" data-speed="2">2 שנ'</button>
        <button type="button" class="speed-btn" data-speed="5">5 שנ'</button>
        <button type="button" class="speed-btn" data-speed="10">10 שנ'</button>
        <button type="button" class="speed-btn" data-speed="20">20 שנ'</button>
        <button type="button" class="speed-btn" data-speed="off">כבוי</button>
      </div>
      <p class="settings-panel__updated" id="updated-at"></p>
    </div>
  </header>

  <main id="reels" class="reels" aria-label="פיד כותרות">
    <p class="status-message" id="status-message">טוען כותרות...</p>
  </main>

  <div class="text-modal" id="text-modal" hidden>
    <div class="text-modal__backdrop"></div>
    <div class="text-modal__panel" role="dialog" aria-modal="true" aria-labelledby="text-modal-title">
      <button type="button" class="text-modal__close" id="text-modal-close" aria-label="סגירה">✕</button>
      <div class="text-modal__meta">
        <span class="text-modal__source" id="text-modal-source"></span>
        <span class="text-modal__time" id="text-modal-time"></span>
      </div>
      <h2 class="text-modal__title" id="text-modal-title"></h2>
      <p class="text-modal__body" id="text-modal-body"></p>
      <a class="text-modal__original-link" id="text-modal-original-link" target="_blank" rel="noopener noreferrer">לצפייה בכתבה המקורית באתר המקור ↗</a>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
